<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wack The Man</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="title-screen" class="title-screen">
        <div class="title-card">
          <p class="eyebrow">yan kaydır · savaş · keşfet</p>
          <h1>WACK THE MAN</h1>
          <p class="tagline">
            Kardeşin kayboldu. Evlere gir, silah bul, barlardan geç… kuleye çık.
          </p>
          <button type="button" id="btn-start">OYUNA GİR</button>
          <p class="controls-hint">
            ←→ hareket · Z/Space zıpla · X saldır · ↑/E kapı · C iksir (yeşil iç / kırmızı at / mavi uç) · R yeniden
          </p>
        </div>
      </div>
      <div id="wrap">
        <div id="hud" aria-live="polite">
          <div class="hud-left">
            <div class="hp-row">
              <span class="label">CAN</span>
              <div class="hp-bar"><div id="hp-fill"></div></div>
              <span id="hp-text">1000</span>
            </div>
            <div id="zone-name">Köy Kenarı</div>
          </div>
          <div class="hud-mid">
            <div id="weapon-slot" class="weapon-slot">
              <span id="weapon-name">Yumruk</span>
              <span id="ammo-text"></span>
            </div>
          </div>
          <div class="hud-inv">
            <div class="slot" title="Jeton">
              <span class="ico coin"></span>
              <span id="coin-count">0</span>
            </div>
            <div id="heal-slot" class="slot" title="Yeşil can iksiri">
              <span class="ico potion heal"></span>
              <span id="potion-count">0</span>
            </div>
            <div id="poison-slot" class="slot" title="Kırmızı zehir">
              <span class="ico potion poison"></span>
              <span id="poison-count">0</span>
            </div>
            <div id="fly-slot" class="slot" title="Mavi uçuş">
              <span class="ico potion fly"></span>
              <span id="fly-count">0</span>
            </div>
            <div id="key-slot" class="slot badge" title="Anahtar">
              <span class="ico key"></span>
            </div>
            <div id="medal-slot" class="slot badge" title="Medalyon">
              <span class="ico medal"></span>
            </div>
          </div>
        </div>
        <canvas id="game" width="960" height="540"></canvas>
        <div id="dialog" aria-hidden="true">
          <div class="dialog-name" id="dialog-name"></div>
          <div class="dialog-text" id="dialog-text"></div>
          <div class="dialog-hint">X / Enter — devam</div>
        </div>
        <div id="story"></div>
        <div id="hint-toast"></div>
        <div id="overlay" aria-hidden="true">
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <button type="button" id="btn-restart">Yeniden</button>
          </div>
        </div>
        <div id="pad" aria-label="Dokunmatik kontroller">
          <div class="pad-left">
            <button type="button" id="btn-left">◀</button>
            <button type="button" id="btn-right">▶</button>
            <button type="button" id="btn-enter" class="btn-enter">Kapı</button>
          </div>
          <div class="pad-right">
            <button type="button" id="btn-potion" class="btn-item">İksir</button>
            <button type="button" id="btn-jump" class="btn-jump">Zıpla</button>
            <button type="button" id="btn-punch" class="btn-atk">Vur</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
